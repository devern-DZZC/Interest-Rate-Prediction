name: Ping Render App Every 13 Minutes

on:
  schedule:
    - cron: '0,13,26,39,52 * * * *'  # At minute 0, 13, 26, 39, and 52
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping App
        run: curl -s https://interest-rate-prediction.onrender.com || echo "Ping failed"
